<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>English Voice Practice</title>

  <!-- Ícono para pestaña de navegador -->
  <link rel="icon" type="image/png" href="./icon.png">

  <!-- Ícono para acceso directo en iPhone / iPad -->
  <link rel="apple-touch-icon" href="./icon.png">

  <!-- Manifiesto para acceso directo en Android -->
  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#0066cc">

  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h2>English Voice Practice</h2>

    <!-- API Key local (BYOK - guardada en este navegador) -->
    <details class="api-key-box">
      <summary>🔑 Gemini API Key (Saved in browser)</summary>
      <div class="api-key-controls">
        <input
          type="password"
          id="gemini-api-key-input"
          placeholder="Paste your Gemini API key..."
          autocomplete="off"
        >
        <button type="button" id="save-api-key-btn" class="small-btn">Save</button>
        <button type="button" id="clear-api-key-btn" class="small-btn secondary-btn">Clear</button>
      </div>
      <span id="api-key-status" class="file-status"></span>
    </details>

    <!-- Ajustes de voz y velocidad TTS -->
    <div class="voice-settings">
      <div class="setting-field">
        <label for="speed-select">⚡ Speed</label>
        <select id="speed-select" aria-label="Speech speed">
          <option value="0.75">Low (Baja)</option>
          <option value="0.95" selected>Medium (Media)</option>
          <option value="1.2">Fast (Rápida)</option>
        </select>
      </div>

      <div class="setting-field">
        <label for="voice-select">🗣️ Voice</label>
        <select id="voice-select" aria-label="Select English voice">
          <option value="">Default English Voice</option>
        </select>
      </div>
    </div>

    <!-- Fuente del JSON: Servidor vs Subir archivo -->
    <div class="source-section">
      <div class="radio-group" role="radiogroup" aria-label="JSON Source">
        <label class="radio-option">
          <input type="radio" name="json-source" id="source-server" value="server" checked>
          <span>🌐 Server JSON</span>
        </label>
        <label class="radio-option">
          <input type="radio" name="json-source" id="source-upload" value="upload">
          <span>📂 Load JSON</span>
        </label>
      </div>

      <!-- Opción 1: Dropdown de JSON en el servidor -->
      <div id="server-panel" class="source-panel">
        <select id="server-json-select" aria-label="Select server JSON">
          <option value="">-- Select a JSON list --</option>
          <option value="./data/all_100_verbs_12_tenses_without_answers.json">100 Verbs 12 tenses</option>
          <option value="./data/questions-only.json">Open Questions (questions-only.json)</option>
          <option value="./data/qa-sample.json">Q&amp;A Sample (qa-sample.json)</option>
          <option value="./data/phrases-sample.json">Phrases Sample (phrases-sample.json)</option>
          <option value="./data/kitchen-items-images.json">Kitchen vocabulary</option>

        </select>
      </div>

      <!-- Opción 2: Cargar archivo JSON local -->
      <div id="upload-panel" class="source-panel hidden">
        <label for="json-file" class="upload-btn">📂 Choose JSON File (.json)</label>
        <input type="file" id="json-file" accept=".json,application/json" hidden>
      </div>

      <span id="file-status" class="file-status">Select a server JSON or load a file</span>
    </div>

    <div class="meta-bar">
      <p id="progress" class="progress"></p>
      <button type="button" id="toggle-visibility-btn" class="visibility-btn" disabled>👁️ Show</button>
    </div>

    <div id="prompt-area" class="prompt-area">
      <img id="question-image" class="question-image hidden" alt="Practice item image">
      <p id="question-text" class="question">Select or load a JSON to start practicing</p>
    </div>

    <div class="controls">
      <button type="button" id="repeat-btn" disabled>🔊 Repeat</button>
      <button type="button" id="mic-btn" disabled>🎤 Speak</button>
    </div>

    <p id="status" class="status"></p>
    <p id="user-answer" class="transcript"></p>
    <div id="star-rating" class="star-rating" aria-label="Star rating"></div>
    <p id="feedback" class="feedback"></p>

    <button type="button" id="next-btn" class="next-btn" disabled>Next Item</button>
  </div>

  <script src="script.js"></script>
</body>
</html>
